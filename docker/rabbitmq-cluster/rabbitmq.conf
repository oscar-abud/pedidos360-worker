# Formación del clúster: cada nodo conoce la lista de miembros.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
# Reintentos de descubrimiento (si el otro nodo tarda en arrancar).
cluster_formation.discovery_retry_limit = 30
cluster_formation.discovery_retry_interval = 2000

# Memoria acotada por nodo (EC2 t3.micro, 1 GB compartido entre 2 nodos).
vm_memory_high_watermark.absolute = 300MiB
disk_free_limit.absolute = 1GB

# El usuario guest solo puede conectarse desde localhost (valor por defecto);
# los servicios usan el usuario definido en RABBITMQ_USER / RABBITMQ_PASSWORD.
loopback_users.guest = true
